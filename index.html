<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Falter Inferno → Void Shop</title>
<style>
  /* --- Intro Animation Section --- */
  body {
    margin: 0;
    font-family: 'Arial', sans-serif;
    overflow-x: hidden;
    overflow-y: auto;
  }

  .scene {
    position: relative;
    height: 100vh;
    background: url('https://images.unsplash.com/photo-1501594907352-04cda38ebc29') center/cover no-repeat;
    filter: grayscale(100%) brightness(0.6);
    animation: fadeIn 2s ease-in-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: scale(1.05); }
    to { opacity: 1; transform: scale(1); }
  }

  .overlay {
    position: absolute;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    color: #fff;
  }

  .overlay h1 {
    font-size: 3rem;
    letter-spacing: 2px;
    text-shadow: 0 0 10px rgba(255,255,255,0.3);
  }

  .overlay p {
    font-size: 1.2rem;
    opacity: 0.8;
  }

  .scroll-hint {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.9rem;
    color: #fff;
    opacity: 0.6;
    animation: blink 2s infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 1; }
  }

  /* --- Shop Section --- */
  #shop {
    display: none;
    background-color: #f4f4f4;
    color: black;
    min-height: 100vh;
  }

  header {
    background-color: #0066cc; color: white;
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 20px;
  }
  header h1 { font-size: 24px; font-weight: bold; }
  .search-bar { flex: 1; margin: 0 20px; }
  .search-bar input { width: 100%; padding: 8px; border-radius: 4px; border: none; }
  .nav-links a { color: white; text-decoration: none; margin-left: 15px; font-weight: bold; cursor: pointer; }

  .product-grid { display: flex; flex-wrap: wrap; justify-content: center; padding: 20px; }
  .product-card {
    background: white; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    margin: 15px; width: 200px; text-align: center; padding: 15px; transition: transform 0.3s;
  }
  .product-card:hover { transform: scale(1.05); }
  .product-card img { width: 100%; height: 150px; object-fit: cover; border-radius: 8px; }
  .btn {
    background-color: #0066cc; color: white; padding: 8px; border: none;
    cursor: pointer; width: 100%; border-radius: 5px; margin-top: 5px;
  }
  .btn:hover { background-color: #004c99; }

  #cart { background: #fff; padding: 20px; margin: 20px; border-radius: 8px; }

  #signinModal {
    display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.7); justify-content: center; align-items: center;
    z-index: 1000;
  }
  #signinModal .box {
    background: white; color: black; padding: 20px; border-radius: 8px;
    width: 300px; text-align: center;
  }

  #qrModal {
    display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.7); justify-content: center; align-items: center;
    z-index: 1000;
  }
  #qrModal img { width: 250px; border-radius: 10px; }
</style>
</head>
<body>

<!-- Intro Scene -->
<div class="scene" id="intro">
  <div class="overlay">
    <h1>Void</h1>
    <p>Dark streets. Silent stories.</p>
  </div>
  <div class="scroll-hint">Scroll Down ↓</div>
</div>

<!-- Shop Section -->
<div id="shop">
  <header>
    <h1>Void Shop</h1>
    <div class="search-bar">
      <input type="text" id="searchInput" onkeyup="searchProducts()" placeholder="Search products...">
    </div>
    <div class="nav-links" id="navLinks">
      <a onclick="openSignin()">Login</a>
      <a onclick="openSignin()">Sign In</a>
    </div>
  </header>

  <div class="product-grid" id="productGrid">
    <p>Loading products...</p>
  </div>

  <div id="cart">
    <h2>🛍️ Cart</h2>
    <ul id="cartItems"></ul>
    <p id="total">Total: 0 MMK</p>
    <button class="btn" onclick="showQR()">ငွေရှင်းရန် (Pay with KPay)</button>
  </div>

  <!-- Sign In Modal -->
  <div id="signinModal">
    <div class="box">
      <h2>Sign In</h2>
      <input type="text" id="signinEmail" placeholder="Email"><br><br>
      <input type="password" id="signinPassword" placeholder="Password"><br><br>
      <input type="password" id="signinConfirm" placeholder="Confirm Password"><br><br>
      <button class="btn" onclick="signinUser()">Sign In</button><br><br>
      <button class="btn" onclick="closeSignin()">Close</button>
    </div>
  </div>

  <!-- KPay QR Modal -->
  <div id="qrModal">
    <div style="text-align:center; background:white; padding:20px; border-radius:8px; max-width: 320px; width: 90%;">
      <!-- ပို့ပေးထားသော KPay QR ပုံ အပြည့်အစုံ -->
      <img src="https://imgur.com/ivPh4TU" alt="KBZPay QR" style="width:100%; border-radius:10px; display:block; margin:0 auto; box-shadow: 0 4px 10px rgba(0,0,0,0.15);">
      <br>
      <button class="btn" onclick="confirmPayment()">ငွေရှင်းပြီးပါပြီ</button><br><br>
      <button class="btn" style="background:#666;" onclick="closeQR()">Close</button>
    </div>
  </div>
  </div>
</div>

<script>
// --- Backend API Base URL ---
const API_BASE_URL = 'http://localhost:3000/api'; // သင့် Backend Domain/Port သို့ ပြောင်းပါ

let total = 0;
let cartList = [];
let allProducts = [];
let currentUser = null;

// --- 1. Intro Transition Logic ---
window.addEventListener('wheel', (e) => {
  const intro = document.getElementById('intro');
  const shop = document.getElementById('shop');
  
  if (e.deltaY > 0 && intro.style.display !== 'none') {
    intro.style.display = 'none';
    shop.style.display = 'block';
    window.scrollTo(0, 0);
    fetchProducts(); // Shop ပေါ်လာချိန်မှ Products များကို API မှ တောင်းမည်
  }
});

let startY = 0;
window.addEventListener('touchstart', (e) => { startY = e.touches[0].clientY; });
window.addEventListener('touchend', (e) => {
  const endY = e.changedTouches[0].clientY;
  const intro = document.getElementById('intro');
  const shop = document.getElementById('shop');

  if (startY - endY > 50 && intro.style.display !== 'none') {
    intro.style.display = 'none';
    shop.style.display = 'block';
    window.scrollTo(0, 0);
    fetchProducts();
  }
});

// --- 2. API Call: Fetch Products ---
async function fetchProducts() {
  const productGrid = document.getElementById('productGrid');
  try {
    const response = await fetch(`${API_BASE_URL}/products`);
    
    // API အလုပ်မလုပ်သေးပါက Fallback Mock Data သုံးရန်
    if(!response.ok) throw new Error("API Connection Failed");
    
    allProducts = await response.json();
    renderProducts(allProducts);

  } catch (error) {
    console.warn("Using offline mock data (API Offline)");
    // Backend API မဖွင့်ရသေးမီ စမ်းသပ်ရန် Mock Data
    allProducts = [
      { id: '1', name: 'Wireless Headphones', price: 25000, img: 'images/headphones.jpg' },
      { id: '2', name: 'Smart Watch', price: 40000, img: 'images/smartwatch.jpg' }
    ];
    renderProducts(allProducts);
  }
}

function renderProducts(products) {
  const productGrid = document.getElementById('productGrid');
  productGrid.innerHTML = '';

  if (products.length === 0) {
    productGrid.innerHTML = '<p>No products found.</p>';
    return;
  }

  products.forEach(p => {
    const card = document.createElement('div');
    card.className = 'product-card';
    card.innerHTML = `
      <img src="${p.img || 'https://via.placeholder.com/150'}" alt="${p.name}">
      <h3>${p.name}</h3>
      <p>${p.price.toLocaleString()} MMK</p>
      <button class="btn" onclick="addToCart('${p.name}', ${p.price}, '${p.id}')">Add to Cart</button>
    `;
    productGrid.appendChild(card);
  });
}

function searchProducts() {
  const query = document.getElementById('searchInput').value.toLowerCase();
  const filtered = allProducts.filter(p => p.name.toLowerCase().includes(query));
  renderProducts(filtered);
}

// --- 3. API Call: Auth / Login ---
async function signinUser() {
  const email = document.getElementById("signinEmail").value.trim();
  const password = document.getElementById("signinPassword").value.trim();
  const confirmPassword = document.getElementById("signinConfirm").value.trim();

  if (!email || !password || !confirmPassword) {
    alert("ကျေးဇူးပြု၍ အချက်အလက်များကို ပြည့်စုံစွာ ဖြည့်သွင်းပါ။");
    return;
  }

  if (password !== confirmPassword) {
    alert("Password နှင့် Confirm Password တူညီမှု မရှိပါ။");
    return;
  }

  try {
    const res = await fetch(`${API_BASE_URL}/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });

    const data = await res.json();

    if (res.ok) {
      currentUser = { email: data.email, token: data.token };
      localStorage.setItem('userToken', data.token); // Save Session
      updateUIOnLogin(email);
    } else {
      // API Offline သို့မဟုတ် Error ဖြစ်ခဲ့လျှင် Local ဖြင့် စမ်းသပ်ခြင်း
      currentUser = { email };
      updateUIOnLogin(email);
    }
  } catch (err) {
    currentUser = { email };
    updateUIOnLogin(email);
  }
}

function updateUIOnLogin(email) {
  alert("Sign In အောင်မြင်ပါသည်။");
  document.getElementById("navLinks").innerHTML = `<span style="color: white; font-weight: bold;">👤 ${email}</span>`;
  closeSignin();
}

// --- 4. Cart Logic ---
function addToCart(product, price, id) {
  if (!currentUser) {
    alert("Please sign in first to use Cart!");
    openSignin();
    return;
  }

  cartList.push({ id, name: product, price });
  
  const cartItems = document.getElementById("cartItems");
  const li = document.createElement("li");
  li.textContent = `${product} - ${price.toLocaleString()} MMK`;
  cartItems.appendChild(li);

  total += price;
  document.getElementById("total").textContent = `Total: ${total.toLocaleString()} MMK`;
}

// --- 5. API Call: Order Submit ---
async function confirmPayment() {
  if (cartList.length === 0) {
    alert("Cart ထဲတွင် ပစ္စည်းမရှိပါ။");
    return;
  }

  try {
    const response = await fetch(`${API_BASE_URL}/orders`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${currentUser?.token || ''}`
      },
      body: JSON.stringify({
        items: cartList,
        totalAmount: total,
        paymentMethod: 'KBZPay'
      })
    });

    if(response.ok) {
      alert("အော်ဒါ တင်ခြင်း အောင်မြင်ပါသည်။");
    } else {
      alert("အော်ဒါ လက်ခံရရှိပါသည်။ (Demo Mode)");
    }
  } catch (error) {
    alert("အော်ဒါ လက်ခံရရှိပါသည်။ (Demo Mode)");
  }

  // Reset Cart
  cartList = [];
  total = 0;
  document.getElementById("cartItems").innerHTML = '';
  document.getElementById("total").textContent = "Total: 0 MMK";
  closeQR();
}

// --- Modal Helpers ---
function showQR() {
  if (!currentUser) {
    alert("Please sign in first to checkout!");
    openSignin();
    return;
  }
  if (cartList.length === 0) {
    alert("Cart ထဲသို့ ပစ္စည်း ထည့်ပါဦး။");
    return;
  }
  document.getElementById("qrModal").style.display = "flex";
}

function closeQR() { document.getElementById("qrModal").style.display = "none"; }
function openSignin() { document.getElementById("signinModal").style.display = "flex"; }
function closeSignin() { document.getElementById("signinModal").style.display = "none"; }
</script>
</body>
</html>
